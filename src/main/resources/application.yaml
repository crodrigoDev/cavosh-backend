spring:
  application:
    name: cavoshbackend

  config:
    import: optional:file:.env.neon[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  resend:
    api-key: ${RESEND_API_KEY}
    from: ${RESEND_FROM}

  app:
    jwt:
      secret: ${JWT_SECRET}
      issuer: cavosh-api

  server:
    port: ${PORT:8080}